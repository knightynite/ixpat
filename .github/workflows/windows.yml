name: windows

on:
  push:
    branches: ['**']
    paths: ['windows/**', '.github/workflows/windows.yml']
    tags: ['win-v*']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']

permissions:
  contents: read  # the release job raises this for itself

jobs:
  x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with: { arch: x64 }
      - name: Configure
        run: cmake --preset x64-release
        working-directory: windows
      - name: Build
        run: cmake --build --preset x64-release
        working-directory: windows
      - name: Test
        run: ctest --preset x64-release
        working-directory: windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ixpat-windows-x64
          path: |
            windows/build/x64-release/*.exe
            !windows/build/x64-release/ixpat_tests.exe
          if-no-files-found: error

  arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with: { arch: amd64_arm64 }
      - name: Configure
        run: cmake --preset arm64-release
        working-directory: windows
      - name: Build
        run: cmake --build --preset arm64-release
        working-directory: windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ixpat-windows-arm64
          path: |
            windows/build/arm64-release/*.exe
            !windows/build/arm64-release/ixpat_tests.exe
          if-no-files-found: error

  # win-v* tags: zips for both architectures plus the x64 installer, attached to a PRE-RELEASE so the Mac app's
  # updater (which reads releases/latest) keeps resolving the macOS release.
  release:
    if: startsWith(github.ref, 'refs/tags/win-v')
    needs: [x64, arm64]
    runs-on: windows-latest
    environment: release  # the federated credential for signing is bound to this environment
    permissions:
      contents: write
      id-token: write  # the signing service is reached with a federated credential, no stored secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist
      # Code signing (Azure Artifact Signing). Off until the repository variable AZURE_SIGNING is "true"; then it
      # needs the secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and the variables
      # AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE. The executables are signed before
      # they are zipped, the installer after it is built, and the checksums are taken last.
      - name: Azure login
        if: vars.AZURE_SIGNING == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the executables
        if: vars.AZURE_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Package zips and installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".Substring(5)
          New-Item -ItemType Directory -Force out | Out-Null
          foreach ($arch in 'x64', 'arm64') {
            $src = "dist/ixpat-windows-$arch"
            Copy-Item windows/README-windows.txt $src/
            Compress-Archive -Path "$src/*" -DestinationPath "out/iXpat-$ver-windows-$arch.zip" -Force
          }
          choco install innosetup --no-progress -y | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "/DSourceDir=$PWD\dist\ixpat-windows-x64" "/O$PWD\out" windows\installer\ixpat.iss
          Get-ChildItem out
      - name: Sign the installer
        if: vars.AZURE_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Checksums
        shell: pwsh
        run: Get-FileHash out\* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content out\SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          prerelease: true
          name: iXpat for Windows ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
